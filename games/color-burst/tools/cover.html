<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
html,body{margin:0;background:#000}
.art{position:relative;overflow:hidden;background:#0b0418 url(theme/halloween/background.jpg) center/cover}
.art::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,rgba(0,0,0,0) 30%,rgba(5,1,10,.75) 100%)}
.logo{position:absolute;left:0;right:0;text-align:center;font-family:"Lilita One","Arial Rounded MT Bold",sans-serif;line-height:.9;z-index:3;filter:drop-shadow(0 8px 0 #1a0526) drop-shadow(0 0 30px rgba(255,120,30,.6))}
.logo .l1{display:block;background:linear-gradient(180deg,#fff3b0 0%,#ffb347 45%,#ff5a14 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #2a0838}
.logo .l2{display:block;background:linear-gradient(180deg,#e9ddff 0%,#a970ff 60%,#5b21b6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #1a0526}
.sym{position:absolute;z-index:2;filter:drop-shadow(0 10px 18px rgba(0,0,0,.6))}
.glow{position:absolute;border-radius:50%;z-index:1;filter:blur(30px)}
.tag{position:absolute;z-index:3;left:50%;transform:translateX(-50%);font-family:"Lilita One",sans-serif;color:#fff;background:linear-gradient(180deg,#ff3d6e,#b5179e);border:3px solid #ffd23f;border-radius:999px;padding:.15em .8em;white-space:nowrap;box-shadow:0 6px 0 #4a0630,0 0 30px rgba(255,61,110,.6)}
#cover{width:1920px;height:1080px}
#tile{width:1200px;height:1600px}
</style>
<div id="cover" class="art">
  <div class="glow" style="left:700px;top:520px;width:520px;height:300px;background:#39ff6a55"></div>
  <img class="sym" src="theme/halloween/symbols/0.png" style="left:770px;top:520px;width:380px">
  <img class="sym" src="theme/halloween/symbols/1.png" style="left:470px;top:600px;width:300px;transform:rotate(-12deg)">
  <img class="sym" src="theme/halloween/symbols/7.png" style="left:1150px;top:590px;width:300px;transform:rotate(10deg)">
  <img class="sym" src="theme/halloween/symbols/3.png" style="left:300px;top:760px;width:220px;transform:rotate(-8deg)">
  <img class="sym" src="theme/halloween/symbols/2.png" style="left:1400px;top:770px;width:220px;transform:rotate(8deg)">
  <img class="sym" src="theme/halloween/symbols/4.png" style="left:560px;top:420px;width:200px;transform:rotate(-18deg)">
  <img class="sym" src="theme/halloween/symbols/5.png" style="left:1180px;top:400px;width:180px;transform:rotate(14deg)">
  <div class="logo" style="top:90px;font-size:210px"><span class="l1">SPOOKY</span><span class="l2">BURST</span></div>
  <div class="tag" style="bottom:46px;font-size:46px">MULTIPLIERS UP TO x1024</div>
</div>
<div id="tile" class="art" style="background-position:72% center">
  <div class="glow" style="left:340px;top:900px;width:520px;height:340px;background:#39ff6a55"></div>
  <img class="sym" src="theme/halloween/symbols/0.png" style="left:360px;top:880px;width:480px">
  <img class="sym" src="theme/halloween/symbols/1.png" style="left:60px;top:980px;width:340px;transform:rotate(-12deg)">
  <img class="sym" src="theme/halloween/symbols/7.png" style="left:800px;top:960px;width:340px;transform:rotate(10deg)">
  <img class="sym" src="theme/halloween/symbols/3.png" style="left:110px;top:720px;width:230px;transform:rotate(-10deg)">
  <img class="sym" src="theme/halloween/symbols/4.png" style="left:820px;top:740px;width:260px;transform:rotate(12deg)">
  <img class="sym" src="theme/halloween/symbols/2.png" style="left:450px;top:1280px;width:300px">
  <div class="logo" style="top:150px;font-size:230px"><span class="l1">SPOOKY</span><span class="l2">BURST</span></div>
  <div class="tag" style="top:660px;font-size:48px">x1024</div>
</div>
