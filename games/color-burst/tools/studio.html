<script>
const DEFS = document.querySelector('svg').innerHTML;
const GLOW=['#39ff6a','#ff8c1a','#ff3b3b','#c9b8ff','#a970ff','#ff3fa4','#ffd23f','#ff2a2a'];
function svgImg(i){ return new Promise(res=>{ const src=`<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="-6 -6 112 112" width="1024" height="1024">${DEFS}<use href="#hw${i}"/></svg>`;
  const im=new Image(); im.onload=()=>res(im); im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src); }); }
let seed=1; const R=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
// symbole "peint" : contour épais, ombre portée, texture, lumière de bord, lueur colorée
function paintSymbol(c, im, i, S, o={}){
  const sc=o.scale||1, rot=o.rot||0, dx=o.dx||0, dy=o.dy||0, glow=o.glow||0;
  const tmp=document.createElement('canvas'); tmp.width=tmp.height=S; const t=tmp.getContext('2d');
  // silhouette pour contour
  const sil=document.createElement('canvas'); sil.width=sil.height=S; const s=sil.getContext('2d');
  s.drawImage(im,0,0,S,S); s.globalCompositeOperation='source-in'; s.fillStyle='#0b0612'; s.fillRect(0,0,S,S);
  const ow=S*0.018; for(let a=0;a<16;a++){ t.drawImage(sil,Math.cos(a/16*6.283)*ow,Math.sin(a/16*6.283)*ow); }
  t.drawImage(im,0,0,S,S);
  // texture (grain + taches) seulement sur le symbole
  t.globalCompositeOperation='source-atop';
  seed=7+i; for(let k=0;k<900;k++){ t.fillStyle=R()<.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.07)'; const r=R()*S*.012+1; t.beginPath(); t.arc(R()*S,R()*S,r,0,7); t.fill(); }
  // lumière de bord (haut-gauche) et ombrage (bas)
  let g=t.createLinearGradient(0,0,S,S); g.addColorStop(0,'rgba(255,255,255,.28)'); g.addColorStop(.45,'rgba(255,255,255,0)'); g.addColorStop(1,'rgba(0,0,0,.35)'); t.fillStyle=g; t.fillRect(0,0,S,S);
  g=t.createLinearGradient(0,S*.55,0,S); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(20,0,30,.35)'); t.fillStyle=g; t.fillRect(0,0,S,S);
  t.globalCompositeOperation='source-over';
  // composition finale
  c.save(); c.translate(S/2+dx,S/2+dy); c.rotate(rot); c.scale(sc,sc); c.translate(-S/2,-S/2);
  c.shadowColor='rgba(0,0,0,.55)'; c.shadowBlur=S*.03; c.shadowOffsetY=S*.025;
  if(glow>0){ c.shadowColor=GLOW[i]; c.shadowBlur=S*.08*glow; c.shadowOffsetY=0; c.drawImage(tmp,0,0); c.shadowBlur=S*.04*glow; }
  c.drawImage(tmp,0,0); c.restore();
}
async function symbolPNG(i,S=320){ const im=await svgImg(i); const cv=document.createElement('canvas'); cv.width=cv.height=S; paintSymbol(cv.getContext('2d'),im,i,S,{scale:.94,glow:.35}); return cv.toDataURL('image/png'); }
// ---------- animations de gain (fond transparent) ----------
function bat(c,x,y,s,f){ c.save(); c.translate(x,y); const w=s,h=s*.45,fl=Math.sin(f)*h*.7; c.beginPath(); c.moveTo(0,-h*.2);
  c.quadraticCurveTo(-w*.35,-h-fl,-w,-h*.2-fl); c.quadraticCurveTo(-w*.7,0,-w*.55,h*.35); c.quadraticCurveTo(-w*.3,h*.05,0,h*.45);
  c.quadraticCurveTo(w*.3,h*.05,w*.55,h*.35); c.quadraticCurveTo(w*.7,0,w,-h*.2-fl); c.quadraticCurveTo(w*.35,-h-fl,0,-h*.2); c.fillStyle='#3b1585'; c.fill(); c.strokeStyle='rgba(201,184,255,.9)'; c.lineWidth=s*.06; c.stroke();
  c.fillStyle='#ffe066'; c.beginPath(); c.arc(-s*.08,-h*.05,s*.05,0,7); c.arc(s*.08,-h*.05,s*.05,0,7); c.fill(); c.restore(); }
function flame(c,x,y,r,col,a){ c.save(); c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,`rgba(255,255,255,${a})`); g.addColorStop(.35,col); g.addColorStop(1,'rgba(0,0,0,0)'); c.globalAlpha=a; c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.restore(); }
function star(c,x,y,s,col,a){ c.save(); c.globalAlpha=a; c.fillStyle=col; c.translate(x,y); c.beginPath(); c.moveTo(0,-s*2); c.lineTo(s*.5,-s*.5); c.lineTo(s*2,0); c.lineTo(s*.5,s*.5); c.lineTo(0,s*2); c.lineTo(-s*.5,s*.5); c.lineTo(-s*2,0); c.lineTo(-s*.5,-s*.5); c.fill(); c.restore(); }
function smoke(c,x,y,r,col,a){ c.save(); const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col); g.addColorStop(1,'rgba(0,0,0,0)'); c.globalAlpha=a; c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.restore(); }
// particules déterministes : position = f(temps) -> boucle parfaite
function parts(n,sd){ seed=sd; return Array.from({length:n},()=>({a:R()*6.283,v:.4+R()*.6,ph:R(),s:.5+R(),x:R()-.5})); }

    ps.b.forEach((q,k)=>{ const t=(p+q.ph)%1; bat(c,S*.5+Math.cos(q.a)*t*S*.42,S*.4-t*S*.3+Math.sin(q.a)*t*S*.15,S*.07*(.6+t),t*40); });
    ps.s.forEach(q=>{ const t=(p+q.ph)%1; star(c,S*.5+Math.cos(q.a)*t*S*.45,S*.45+Math.sin(q.a)*t*S*.45,S*.012*q.s,'#e6ffe9',(1-t)); });
  },

  2:(c,S,p,ps)=>{ ps.f.forEach(q=>{ const t=(p+q.ph)%1; smoke(c,S*.5+q.x*S*.6,S*.6-t*S*.5,S*(.08+t*.12)*q.s,'#7c3aed',(1-t)*.55); }); ps.s.forEach(q=>{ const t=(p+q.ph)%1; star(c,S*.5+Math.cos(q.a)*t*S*.45,S*.45+Math.sin(q.a)*t*S*.45,S*.01*q.s,'#ff6b6b',1-t); }); },
  3:(c,S,p,ps)=>{ ps.f.forEach(q=>{ const t=(p+q.ph)%1; smoke(c,S*.5+q.x*S*.6+Math.sin(t*6+q.a)*S*.05,S*.8-t*S*.7,S*(.06+t*.08)*q.s,'#efeaff',(1-t)*.6); }); ps.s.forEach(q=>{ const t=(p+q.ph)%1; star(c,S*.5+Math.cos(q.a)*t*S*.45,S*.5+Math.sin(q.a)*t*S*.45,S*.01*q.s,'#ffffff',1-t); }); },
