<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Creepster&display=swap">
<style>
html,body{margin:0;background:#000}
.art{position:relative;overflow:hidden}
.c169{width:1920px;height:1080px}.c34{width:1200px;height:1600px}
img.s{position:absolute;filter:drop-shadow(0 18px 24px rgba(0,0,0,.7))}
.abs{position:absolute;inset:0}
/* logo 3D épais */
.logo3d{position:absolute;left:0;right:0;text-align:center;font-family:"Lilita One",sans-serif;line-height:.86;z-index:5}
.logo3d .w{display:block;position:relative}
.logo3d .w::before{content:attr(data-t);position:absolute;left:0;right:0;color:#1a0526;transform:translateY(.09em);-webkit-text-stroke:.09em #1a0526;z-index:-1}
.logo3d .a{background:linear-gradient(180deg,#fff7c2 0%,#ffc23d 40%,#ff6a00 75%,#c22d00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.02em #3a0a00}
.logo3d .b{background:linear-gradient(180deg,#f4ecff 0%,#b98cff 45%,#7c3aed 75%,#3b1585 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.02em #14062a}
.logo3d .g{background:linear-gradient(180deg,#eaffef 0%,#7dff9e 40%,#22c55e 75%,#0f6b30 100%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:.02em #062a12}
.glowtxt{filter:drop-shadow(0 0 40px rgba(255,140,30,.55))}
.badge{position:absolute;font-family:"Lilita One",sans-serif;color:#14092a;border-radius:999px;padding:.05em .45em;box-shadow:0 .08em 0 rgba(0,0,0,.45),0 0 30px currentColor;z-index:4}
.rays{background:repeating-conic-gradient(from 0deg at 50% 55%,rgba(255,255,255,.10) 0 6deg,rgba(255,255,255,0) 6deg 18deg)}
</style>
