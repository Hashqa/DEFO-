<!doctype html><meta charset="utf-8"><script>
// Boucle Halloween : 120 BPM, la mineur, 16 mesures (32 s). Rendu hors ligne puis repli de la queue d'écho sur le début.
async function render(){
  const SR=44100, BAR=2, BARS=16, LEN=BARS*BAR, TAIL=2;
  const ac=new OfflineAudioContext(2,SR*(LEN+TAIL),SR);
  const N=f=>440*Math.pow(2,(f-69)/12);
  const master=ac.createGain(); master.gain.value=.5;
  const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4; master.connect(comp).connect(ac.destination);
  const fx=ac.createGain(); const dl=ac.createDelay(1), fb=ac.createGain(), wet=ac.createGain(); dl.delayTime.value=.375; fb.gain.value=.35; wet.gain.value=.35;
  fx.connect(master); fx.connect(dl); dl.connect(fb).connect(dl); dl.connect(wet).connect(master);
  // "réverbe" simple : bruit décroissant en convolution
  const ir=ac.createBuffer(2,SR*2.2,SR); for(let ch=0;ch<2;ch++){ const d=ir.getChannelData(ch); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,3); }
  const verb=ac.createConvolver(); verb.buffer=ir; const vg=ac.createGain(); vg.gain.value=.22; verb.connect(vg).connect(master);
  function voice(type,f,t,d,v,o={}){ const os=ac.createOscillator(), g=ac.createGain(); os.type=type; os.frequency.setValueAtTime(f,t); if(o.det) os.detune.value=o.det;
    if(o.slideTo) os.frequency.exponentialRampToValueAtTime(o.slideTo,t+d); let n=os;
    if(o.lp){ const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.frequency.setValueAtTime(o.lp,t); fl.Q.value=o.q||6; if(o.lpTo) fl.frequency.exponentialRampToValueAtTime(o.lpTo,t+d); os.connect(fl); n=fl; }
    g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+(o.att||.005)); if(o.hold) g.gain.setValueAtTime(v,t+d-o.rel); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    let out=n.connect(g); if(o.pan!==undefined){ const p=ac.createStereoPanner(); p.pan.value=o.pan; out=g.connect(p); }
    out.connect(o.out||master); if(o.verb) out.connect(verb); os.start(t); os.stop(t+d+.05); }
  function noise(t,d,v,hp,pan=0){ const len=Math.floor(SR*d), b=ac.createBuffer(1,len,SR), c=b.getChannelData(0); for(let i=0;i<len;i++) c[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=ac.createBufferSource(); s.buffer=b; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain(); g.gain.value=v; const p=ac.createStereoPanner(); p.pan.value=pan; s.connect(f).connect(g).connect(p).connect(master); s.start(t); }
  const CH=[{root:45,ch:[57,60,64,69]},{root:41,ch:[53,57,60,65]},{root:38,ch:[50,53,57,62]},{root:40,ch:[52,56,59,64]}];
  const MEL=[76,null,77,null,76,null,74,null,72,null,null,null,69,null,null,null,74,null,72,null,69,null,65,null,68,null,null,null,71,null,null,null];
  // thérémine continu
  const th=ac.createOscillator(), thg=ac.createGain(), lfo=ac.createOscillator(), lg=ac.createGain(); th.type='sine'; lfo.frequency.value=5.8; lg.gain.value=7; lfo.connect(lg).connect(th.frequency); thg.gain.value=0;
  th.connect(thg); thg.connect(fx); thg.connect(verb); th.start(0); lfo.start(0); th.stop(LEN+TAIL); lfo.stop(LEN+TAIL);
  const sp=.125;
  for(let step=0; step<BARS*16; step++){
    const t=step*sp, bar=Math.floor(step/16), i=step%16, c=CH[bar%4], sec=Math.floor(bar/4); // sections 0..3
    // rythme
    if(i%4===0) voice('sine',150,t,.3,.95,{slideTo:40});
    if(sec>=1 && i%4===2) noise(t,.05,.16,7000,.3);
    if(sec>=1 && (i===4||i===12)) noise(t,.2,.25,1400);
    if(sec===3 && i%2===1) noise(t,.03,.07,9000,-.3);
    // basse synthwave
    if(i%2===0){ const n=c.root+((i%8===6)?12:0); voice('sawtooth',N(n),t,.22,.24,{lp:900,lpTo:200,q:8}); voice('square',N(n-12),t,.22,.08,{lp:300}); }
    // clavecin arpégé (+ ornement)
    voice('square',N(c.ch[i%4]+12),t,.12,.045,{lp:3800,out:fx,pan:(i%2?.35:-.35)});
    if(i===15 && bar%2===1) voice('square',N(c.ch[3]+24),t,.09,.03,{lp:5000,out:fx});
    // thérémine (sections 1-3)
    const m=MEL[(Math.floor(step/2))%32];
    if(sec>=1 && i%2===0 && m){ th.frequency.setTargetAtTime(N(m),t,.07); thg.gain.setTargetAtTime(.08,t,.08); thg.gain.setTargetAtTime(.035,t+.6,.25); }
    // nappe de chœur (sections 2-3)
    if(sec>=2 && i===0) c.ch.slice(0,3).forEach((n,k)=>{ voice('sawtooth',N(n),t,BAR,.025,{lp:1200,att:.4,hold:true,rel:.4,det:(k-1)*8,verb:true}); voice('sine',N(n+12),t,BAR,.02,{att:.4,hold:true,rel:.4,verb:true}); });
  }
  // fondu du thérémine en fin de boucle -> raccord avec la section 0
  thg.gain.setTargetAtTime(0,LEN-.5,.15);
  const buf=await ac.startRendering();
  // repli de la queue (écho/réverbe) sur le début pour une boucle sans coupure
  const out=[]; for(let ch=0;ch<2;ch++){ const d=buf.getChannelData(ch), o=new Float32Array(SR*LEN); o.set(d.subarray(0,SR*LEN)); for(let i=0;i<SR*TAIL;i++) o[i]+=d[SR*LEN+i]; out.push(o); }
  // WAV 16 bits
  const n=out[0].length, wav=new DataView(new ArrayBuffer(44+n*4)); const ws=(o,s)=>{ for(let i=0;i<s.length;i++) wav.setUint8(o+i,s.charCodeAt(i)); };
  ws(0,'RIFF'); wav.setUint32(4,36+n*4,true); ws(8,'WAVEfmt '); wav.setUint32(16,16,true); wav.setUint16(20,1,true); wav.setUint16(22,2,true); wav.setUint32(24,SR,true); wav.setUint32(28,SR*4,true); wav.setUint16(32,4,true); wav.setUint16(34,16,true); ws(36,'data'); wav.setUint32(40,n*4,true);
  let peak=0; for(const o of out) for(let i=0;i<n;i++) peak=Math.max(peak,Math.abs(o[i])); const k=.89/peak;
  for(let i=0;i<n;i++) for(let ch=0;ch<2;ch++) wav.setInt16(44+(i*2+ch)*2, Math.max(-1,Math.min(1,out[ch][i]*k))*32767, true);
  const bytes=new Uint8Array(wav.buffer); let s=''; for(let i=0;i<bytes.length;i+=0x8000) s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(s);
}
window.render=render; document.title='ready';
</script>
